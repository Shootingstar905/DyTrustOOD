[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DyTrust-OOD"
version = "0.3.0"
description = "Core temporal-stability and Hodge structural model for trust-link prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["dytrust_ood*"]
